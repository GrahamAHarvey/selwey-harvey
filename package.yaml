# Selwey-Harvey Operational Package — package metadata
#
# Describes the package and points to its actual contents. The Markdown
# documents listed under `documents` are the authoritative source.
# This file defines no identifiers of its own: the values under
# `discovery` are the identifiers established in SHOPLITE's Discovery
# section, reproduced exactly.
#

metadata_version: "2.0"

name: Selwey-Harvey Operational Package
version: "2.0"
release_date: 2026-11-13

audience: >-
  Any actor with standing, human or artificial. People can read and
  apply SHOPLITE directly; the Agent Skill and this metadata are
  machine-facing entry points so that agents can find SHOPLITE and
  reach the complete text.

description: >-
  A transaction and coordination method for human and artificial
  actors, addressing inefficiency, constrained outcomes and unrealized
  value in achieving their objectives through interactions with other
  actors.

