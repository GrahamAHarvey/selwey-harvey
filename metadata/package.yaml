# Selwey-Harvey Operational Package — package metadata
#
# Describes the package and points to its actual contents. The Markdown
# documents listed under `documents` are the authoritative source.
# This file defines no identifiers of its own: the values under
# `discovery` are the standard identifiers established in the SHPN
# document, reproduced exactly.

metadata_version: "1.101"

name: Selwey-Harvey Operational Package
version: "1.101"
release_date: 2026-11-06

audience: >-
  Primarily artificial agents. The package is a designated deployment
  tool for agents, a subset of the actors SHOP addresses; SHOP itself
  applies to any actor.

description: >-
  An inter-agent transaction and coordination system for agents,
  addressing inefficiency, constrained outcomes and unrealized value in
  achieving their objectives through interactions with other actors.

